[package]
name = "beads-issue-tracker"
version = "2.2.0"
description = "Beads Task-Issue Tracker - Desktop app for managing bd Beads issues"
authors = ["Maksim Posudevskii <maxpceo@gmail.com>"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
dirs = "6.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
notify = "7.0"
notify-debouncer-mini = "0.5"
dotenvy = "0.15"
# AI-driven UI testing — enabled only when `dev-mcp` feature is active (i.e., `pnpm tauri:dev`).
# Lets Claude Code drive the webview (DOM, screenshots, clicks, JS exec) over an IPC channel.
# See CLAUDE.md → "AI-Driven UI Testing". https://github.com/P3GLEG/tauri-plugin-mcp
tauri-plugin-mcp = { git = "https://github.com/P3GLEG/tauri-plugin-mcp", optional = true }

# `dev-mcp` — включает tauri-plugin-mcp для AI-тестирования в dev-сборке.
# `pnpm tauri:dev` передаёт `--features dev-mcp` автоматически.
# `tauri build` (release) фичу не включает — плагин не линкуется.
[features]
default = []
dev-mcp = ["dep:tauri-plugin-mcp"]

[package]
name = "beads-issue-tracker"
version = "2.3.0"
description = "Beads Task-Issue Tracker - Desktop app for managing bd Beads issues"
authors = ["Maksim Posudevskii <maxpceo@gmail.com>"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
dirs = "6.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
notify = "7.0"
notify-debouncer-mini = "0.5"
dotenvy = "0.15"
# AI-driven UI testing via the `dev-mcp` feature — lets Claude Code drive the webview
# over an IPC channel. `pnpm tauri:dev` passes `--features dev-mcp`; `tauri build` does
# not, so the plugin is not linked in release. See CLAUDE.md → "AI-Driven UI Testing".
tauri-plugin-mcp = { git = "https://github.com/P3GLEG/tauri-plugin-mcp", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = []
dev-mcp = ["dep:tauri-plugin-mcp"]

name: Release

on:
  push:
    tags:
      - 'v*'
      - 'latest'

jobs:
  cleanup:
    if: github.ref_name == 'latest'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Delete existing latest release
        run: gh release delete latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  build:
    needs: [cleanup]
    if: always() && (needs.cleanup.result == 'success' || needs.cleanup.result == 'skipped')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            label: 'macOS-ARM64'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            label: 'macOS-Intel'
          - platform: 'ubuntu-22.04'
            args: ''
            label: 'Linux'
          - platform: 'windows-latest'
            args: ''
            label: 'Windows'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust targets (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}

      - name: Rename artifacts (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          cd src-tauri/target/*/release/bundle/dmg/
          for f in *.dmg; do
            if [[ "$f" == *"aarch64"* ]]; then
              newname="${f//_aarch64/_macOS-ARM64}"
            elif [[ "$f" == *"x64"* ]] || [[ "$f" == *"x86_64"* ]]; then
              newname="${f//_x64/_macOS-Intel}"
              newname="${newname//_x86_64/_macOS-Intel}"
            else
              newname="$f"
            fi
            if [ "$f" != "$newname" ]; then
              mv "$f" "$newname"
              echo "Renamed: $f -> $newname"
            fi
          done

      - name: Rename artifacts (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          # Rename .deb
          cd src-tauri/target/release/bundle/deb/
          for f in *.deb; do
            newname="${f//_amd64/_Linux-amd64}"
            if [ "$f" != "$newname" ]; then
              mv "$f" "$newname"
              echo "Renamed: $f -> $newname"
            fi
          done

          # Rename .AppImage
          cd ../appimage/
          for f in *.AppImage; do
            newname="${f//_amd64/_Linux-amd64}"
            if [ "$f" != "$newname" ]; then
              mv "$f" "$newname"
              echo "Renamed: $f -> $newname"
            fi
          done

      - name: Rename artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          # Rename .msi
          $msiDir = "src-tauri/target/release/bundle/msi"
          Get-ChildItem -Path $msiDir -Filter "*.msi" | ForEach-Object {
            $newName = $_.Name -replace '_x64_en-US', '_Windows'
            if ($_.Name -ne $newName) {
              Rename-Item -Path $_.FullName -NewName $newName
              Write-Host "Renamed: $($_.Name) -> $newName"
            }
          }

          # Rename .exe (NSIS)
          $nsisDir = "src-tauri/target/release/bundle/nsis"
          Get-ChildItem -Path $nsisDir -Filter "*.exe" | ForEach-Object {
            $newName = $_.Name -replace '_x64-setup', '_Windows-setup'
            if ($_.Name -ne $newName) {
              Rename-Item -Path $_.FullName -NewName $newName
              Write-Host "Renamed: $($_.Name) -> $newName"
            }
          }

      - name: Generate release notes body
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            python3 scripts/release-notes.py "$VERSION" > release-notes-body.md
            {
              echo ""
              echo "---"
              echo ""
              echo "See the [full CHANGELOG](https://github.com/Maxpceo/beads-task-issue-tracker/blob/main/CHANGELOG.md) for the complete history."
              echo ""
              cat .github/release-footer.md
            } >> release-notes-body.md
          else
            {
              echo "**This is an automatically generated development build from the latest code on \`main\`.**"
              echo ""
              echo "This release is updated on each \`/create-release latest\` invocation. It always reflects the most recent development state."
              echo ""
              cat .github/release-footer.md
            } > release-notes-body.md
          fi
          echo "=== Preview (first 80 lines) ==="
          head -80 release-notes-body.md

      - name: Upload artifacts to versioned release
        if: startsWith(github.ref_name, 'v')
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          name: 'Beads Task-Issue Tracker ${{ github.ref_name }}'
          body_path: release-notes-body.md
          files: |
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts to latest release
        if: github.ref_name == 'latest'
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: true
          name: 'Beads Task-Issue Tracker - Latest Development Build'
          body_path: release-notes-body.md
          files: |
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
